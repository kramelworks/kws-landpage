<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KramelWorks - Lançamento</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    header {
      margin-bottom: 30px;
    }

    /* Container circular da logo */
    .logo-circle {
      width: 150px;
      height: 150px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      margin: 0 auto;
    }

    .logo-circle img {
      width: 100px;
      height: auto;
    }

    h1 {
      font-size: 2.5rem;
      margin: 20px 0;
      color: #f97316;
    }

    p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: 0 auto 20px;
      line-height: 1.5;
    }

    .cta-button {
      background: #f97316;
      color: white;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .cta-button:hover {
      background: #fb923c;
    }

    footer {
      position: absolute;
      bottom: 15px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-circle">
      <img src="70133ebb-ae0e-413e-baa1-ae386f3fbea0.png" alt="Logo KramelWorks">
    </div>
  </header>

  <main>
    <h1>Em Breve: KramelWorks 🚀</h1>
    <p>
      Estamos construindo algo incrível para transformar ideias em realidade.
    </p>  
      <br/>Fique ligado para novidades!

  </main>

  <footer>
    © 2025 KramelWorks - Todos os direitos reservados
  </footer>
</body>
</html>
